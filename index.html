<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Habits Mind</title>
  <link rel="manifest" href="manifest.json">
<style>
:root{--bg:#fff;--card:#f2f2f2;--ink:#1a1a1a;--mute:#8a8a8e;--green:#5a9e6a;--red:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:520px;height:100%;margin:0 auto;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow-y:auto;padding:22px 20px 110px}
h1{font-size:30px;font-weight:700;margin:0;letter-spacing:-.4px}
.sub{color:var(--mute);font-size:16px;margin-top:4px}
.gear{position:absolute;right:20px;top:20px;color:var(--ink)}
.list{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.wrap{position:relative;border-radius:18px;background:var(--red);overflow:hidden;transition:height .25s,margin .25s,opacity .25s}
.wrap .trash{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:#fff}
.row{position:relative;display:flex;align-items:center;gap:16px;background:var(--card);padding:0 16px;height:64px;border-radius:18px;touch-action:pan-y;user-select:none;transition:transform .2s}
.row.drag{transition:none}
.row .nm{flex:1;font-size:17px}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px solid #c4c4c8;display:grid;place-items:center;flex:none;transition:.15s}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.on .chk{background:var(--green);border-color:var(--green)}.on .chk svg{opacity:1}
.sum{position:absolute;z-index:2;left:20px;right:20px;bottom:calc(64px + env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:16px;background:var(--card);border-radius:18px;padding:14px 18px;text-align:left}
.sum small{display:block;color:var(--mute);font-size:13px}.sum b{font-size:20px}.sum .go{margin-left:auto;color:var(--ink)}
.empty{margin-top:60px;text-align:center;color:var(--mute);line-height:1.5}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:#fff;border-top:1px solid #eee}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#a5a5aa}
.tabs button.act{color:var(--ink);font-weight:600}
.card{background:var(--card);border-radius:22px;padding:22px 16px;margin-top:22px;text-align:center}
.ring{position:relative;width:132px;height:132px;margin:0 auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:600}
.card p{margin:0;font-size:13px}.card strong{display:block;font-size:17px;margin-top:4px}
h2{font-size:20px;margin:30px 0 16px}
.best{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.best .t{flex:1;font-size:14px}.best .t div{display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:4px;background:#e6e6e6;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.modal{position:absolute;inset:0;background:#fff;z-index:5;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.mh{display:flex;justify-content:space-between;margin-bottom:22px}
.inp{width:100%;margin-top:22px;background:var(--card);border:0;border-radius:16px;height:58px;padding:0 20px;font:inherit;font-size:17px;color:var(--ink);outline:none}
.inp.bad{animation:sh .3s}@keyframes sh{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.lbl{margin:26px 0 12px;font-size:15px;font-weight:500}
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px}
.seg button{flex:1;height:42px;border-radius:12px;font-size:14px;color:#555}
.seg button.act{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.icons button{aspect-ratio:1;border-radius:14px;background:var(--card);display:grid;place-items:center;border:2px solid transparent}
.icons button.act{border-color:var(--ink);background:#fff}
.add{margin-top:auto;height:56px;border-radius:28px;background:#1c1c1e;color:#fff;font-size:17px;font-weight:600;flex:none}
.spacer{height:24px;flex:none}
#splash{position:absolute;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash svg{width:132px;height:132px;fill:none;stroke:#1a1a1a;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#splash svg path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.5,0,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
#splash h1{font-size:38px;margin-top:22px}#splash p{color:var(--mute);font-size:19px;line-height:1.45;margin:18px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="main"></div>
  <div id="splash">
    <svg id="logo" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <h1>Habits Mind</h1>
    <p>Маленькі звички.<br>Великі зміни.</p>
  </div>
</div>
<script>
const P={
dumbbell:'M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12',
drop:'M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z',
book:'M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14',
yoga:'M12 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM5 19c3 0 4-3 7-3s4 3 7 3M8 13c2 1 6 1 8 0M12 8v6',
moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
apple:'M12 7c-3-2-7 0-7 5 0 4 3 8 5 8 1 0 1.5-.5 2-.5s1 .5 2 .5c2 0 5-4 5-8 0-5-4-7-7-5zM12 7c0-2 1-3 3-4',
heart:'M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z',
sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
coffee:'M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9zM17 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3',
music:'M9 18V6l10-2v12M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
pencil:'M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3',
leaf:'M5 19c0-8 5-13 14-14 0 9-5 14-13 14M5 19l7-7',
gear:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19 12l2-1.5-2-3.5-2.3.7-1.7-1L14.5 4h-4L10 6.7l-1.7 1L6 7l-2 3.5L6 12l-2 1.5L6 17l2.300-.7 1.7 1L10.500 20h4l.5-2.700 1.700-1 2.300.7 2-3.500z',
trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6',
x:'M5 5l14 14M19 5L5 19',ok:'M4 12.500l5 5L20 6.500',chev:'M9 5l7 7-7 7',
home:'M4 11l8-7 8 7v9H4z',bars:'M6 20v-7M12 20V5M18 20v-10',plus:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 8v8M8 12h8'};
const ICONS=['dumbbell','drop','book','yoga','moon','apple','heart','sun','coffee','music','pencil','leaf'];
const svg=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}><path d="${P[n]}"/></svg>`;
const MON=['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const FREQ={daily:'Щодня',weekly:'Щотижня',monthly:'Щомісяця'};
const KEY='habitsMind.v1';
let S={habits:[]},tab='home',modal=false,form={name:'',freq:'daily',icon:'dumbbell'};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pk=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function due(h,d){
  const c=pk(h.created);if(dk(d)<h.created)return false;
  if(h.freq==='daily')return true;
  if(h.freq==='weekly')return d.getDay()===c.getDay();
  return d.getDate()===Math.min(c.getDate(),dim(d.getFullYear(),d.getMonth()));
}
function stat(h,from,to){let s=0,d=0;for(let t=new Date(from);t<=to;t.setDate(t.getDate()+1)){if(due(h,t)){s++;if(h.done[dk(t)])d++}}return{s,d}}
let today=dk(new Date());
function render(){
  const main=document.getElementById('main'),now=new Date();today=dk(now);
  let h='';
  if(tab==='home'){
    const list=S.habits.filter(x=>due(x,now)),dn=list.filter(x=>x.done[today]).length;
    h+=`<div class="screen">
    <h1>Сьогодні</h1><div class="sub">${now.getDate()} ${MON[now.getMonth()]}</div>
    <div class="list">${list.map(x=>`<div class="wrap" data-id="${x.id}"><span class="trash">${svg('trash')}</span>
      <div class="row ${x.done[today]?'on':''}">${svg(x.icon)}<span class="nm">${esc(x.name)}</span><span class="chk"><svg viewBox="0 0 24 24"><path d="${P.ok}"/></svg></span></div></div>`).join('')}</div>
    ${list.length?'':`<div class="empty">${S.habits.length?'На сьогодні звичок немає.':'Тут поки порожньо.<br>Натисніть «Додати», щоб створити першу звичку.'}</div>`}</div>
    <button class="sum" id="sum">${svg('bars')}<span><small>Виконано сьогодні</small><b>${dn} з ${list.length}</b></span><span class="go">${svg('chev',20)}</span></button>`;
  }else{
    const f=new Date(now.getFullYear(),now.getMonth(),1);let S1=0,D1=0;
    const rows=S.habits.map(x=>{const m=stat(x,f,now),a=stat(x,pk(x.created),now);S1+=m.s;D1+=m.d;return{x,p:a.s?Math.round(a.d/a.s*100):0}}).sort((a,b)=>b.p-a.p).slice(0,5);
    const pc=S1?Math.round(D1/S1*100):0,C=2*Math.PI*52;
    h+=`<div class="screen"><h1>Статистика</h1><div class="card"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#e2e2e2" stroke-width="9"/><circle cx="60" cy="60" r="52" fill="none" stroke="#5a9e6a" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}"/></svg><b>${pc}%</b></div>
    <p>Виконано цього місяця</p><strong>${D1} з ${S1}</strong></div>
    <h2>Найкращі звички</h2>${rows.length?rows.map(r=>`<div class="best">${svg(r.x.icon)}<div class="t"><div><span>${esc(r.x.name)}</span><span>${r.p}%</span></div><div class="bar"><i style="width:${r.p}%"></i></div></div></div>`).join(''):'<div class="empty" style="margin-top:20px">Додайте звички — тут з’явиться ваш прогрес.</div>'}</div>`;
  }
  h+=`<div class="tabs">${[['home','Головна','home'],['stats','Статистика','bars'],['add','Додати','plus']].map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'act':''}">${svg(t[2])}<span>${t[1]}</span></button>`).join('')}</div>`;
  if(modal)h+=`<div class="modal"><div class="mh"><button id="mx" aria-label="Закрити">${svg('x')}</button><button id="mok" aria-label="Зберегти">${svg('ok')}</button></div>
    <h1>Нова звичка</h1><input class="inp" id="nm" maxlength="40" placeholder="Назва звички..." value="${esc(form.name)}">
    <div class="lbl">Частота</div><div class="seg">${Object.keys(FREQ).map(k=>`<button data-f="${k}" class="${form.freq===k?'act':''}">${FREQ[k]}</button>`).join('')}</div>
    <div class="lbl">Іконка</div><div class="icons">${ICONS.map(k=>`<button data-ic="${k}" class="${form.icon===k?'act':''}" aria-label="${k}">${svg(k)}</button>`).join('')}</div>
    <div class="spacer"></div><button class="add" id="addb">Додати</button></div>`;
  main.innerHTML=h;bind();
}
function bind(){
  const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
  qa('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.t==='add'){form={name:'',freq:'daily',icon:'dumbbell'};modal=true}else tab=b.dataset.t;render()});
  const sum=q('#sum');if(sum)sum.onclick=()=>{tab='stats';render()};
  qa('.wrap').forEach(swipe);
  if(modal){
    const nm=q('#nm');nm.oninput=()=>form.name=nm.value;
    qa('[data-f]').forEach(b=>b.onclick=()=>{form.name=nm.value;form.freq=b.dataset.f;render()});
    qa('[data-ic]').forEach(b=>b.onclick=()=>{form.name=nm.value;form.icon=b.dataset.ic;render()});
    q('#mx').onclick=()=>{modal=false;render()};
    const go=()=>{const n=nm.value.trim();if(!n){nm.classList.add('bad');nm.focus();setTimeout(()=>nm.classList.remove('bad'),400);return}
      S.habits.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,freq:form.freq,icon:form.icon,created:today,done:{}});
      save();modal=false;tab='home';render()};
    q('#mok').onclick=go;q('#addb').onclick=go;nm.onkeydown=e=>{if(e.key==='Enter')go()};
  }
}
function swipe(w){
  const row=w.querySelector('.row'),id=w.dataset.id;let x0=0,y0=0,dx=0,mode=0,pid=null;
  row.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;dx=0;mode=0;pid=e.pointerId};
  row.onpointermove=e=>{
    if(pid!==e.pointerId)return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(!mode){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)&&mx>0){mode=1;row.classList.add('drag');row.setPointerCapture(pid)}else return}
    dx=Math.max(0,mx);row.style.transform=`translateX(${dx}px)`;
  };
  const end=()=>{
    if(pid===null)return;pid=null;
    if(mode){
      row.classList.remove('drag');
      if(dx>Math.min(110,w.offsetWidth*.35)){
        row.style.transform='translateX(110%)';
        const hh=w.offsetHeight;w.style.height=hh+'px';
        setTimeout(()=>{w.style.height='0px';w.style.marginTop='-12px';w.style.opacity='0'},180);
        setTimeout(()=>{S.habits=S.habits.filter(h=>h.id!==id);save();render()},450);
      }else row.style.transform='';
      setTimeout(()=>mode=0,50);
    }
  };
  row.onpointerup=end;row.onpointercancel=end;
  row.onclick=()=>{
    if(mode)return;
    const h=S.habits.find(h=>h.id===id);if(!h)return;
    if(h.done[today])delete h.done[today];else h.done[today]=1;
    save();render();
  };
}
render();
(function(){
  const L=['M50 24C46 17 36 16 31 22C24 22 19 28 20 35C14 38 13 47 18 52C15 58 18 66 25 68C27 75 35 79 41 75C44 78 48 78 50 76',
    'M20 35C25 36 28 39 28 43','M18 52C24 52 29 50 31 46C35 46 38 43 38 39','M25 68C28 63 33 62 36 64C40 62 43 58 42 54',
    'M41 75C40 70 44 67 47 67','M31 22C32 28 37 30 42 29','M50 40C45 40 42 37 42 33','M50 58C47 60 45 62 44 66'];
  let h='<path pathLength="1" d="M50 24V76" style="--d:.1s"/>';
  L.forEach((d,i)=>{const s=`pathLength="1" d="${d}" style="--d:${(i*.08).toFixed(2)}s"`;
    h+=`<path ${s}/><path ${s} transform="translate(100 0) scale(-1 1)"/>`});
  document.getElementById('logo').innerHTML=h;
})();
setTimeout(()=>document.getElementById('splash').classList.add('hide'),2300);
// нова дата — оновлюємо екран автоматично
const chk=()=>{if(dk(new Date())!==today&&!modal)render()};
setInterval(chk,15000);document.addEventListener('visibilitychange',chk);
</script>
</body>
</html>
